name: Verify multi-platform MCP auditor
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check
          python -m compileall -q src
      - name: Run behavior checks
        run: python -m unittest discover -s tests -v
      - name: Verify runtime imports
        run: |
          python -c "from automation_auditor_mcp.server import mcp; print('MCP SDK v2 server imports')"
          automation-audit --list-platforms
          automation-audit examples/n8n-valid.json --platform auto
